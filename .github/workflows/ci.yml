name: CI

# Compiles the sketch on every push and PR. The agent needs a display to
# run, so CI only checks that it builds.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw -B -DskipTests package
